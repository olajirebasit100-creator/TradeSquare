<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check List</title>

  <link rel="stylesheet" href="styles/body.css">
  <link rel="stylesheet" href="styles/checklist-page/checkout-header.css">
  <link rel="stylesheet" href="styles/checklist-page/checklist.css">
</head>
<body>

  <header class="cart-header">
    <nav class="cart-navbar">
      <a href="index.html" class="logo">
        <span class="logo-text">NexMart</span>
        <span class="logo-version">1.0</span>
        <span class="logo-mobile"></span>
      </a>
      <h2 class="cart-title">
        Checklist<span>(3 Items)</span>
      </h2>
      <a href="products-page.html" class="continue-shopping">
        Continue Shopping
      </a>
    </nav>
  </header>


  <main class="watchlist-page">
    <div class="watchlist-container">

      <div class="watchlist-items">

        <h2 class="section-title">Saved Listings</h2>

        <div class="saved-items-container js-saved-items">

        <!-- Cart items will be generated here -->

        </div>

      </div>

      <aside class="watchlist-summary">

        <h2 class="summary-title">Watchlist Summary</h2>

        <div class="summary-section">

          <div class="summary-row">
            <p>Saved Items</p>
            <p class="js-saved-items-count">0</p>
          </div>

        </div>

        <div class="summary-section">

        <h3>Categories</h3>

          <div class="summary-row">
              <p>Phones</p>
              <p class="js-phone-count">0</p>
          </div>

          <div class="summary-row">
            <p>Vehicles</p>
            <p class="js-vehicle-count">0</p>
          </div>

          <div class="summary-row">
            <p>Fashion</p>
            <p class="js-fashion-count">0</p>
          </div>

          <div class="summary-row">
            <p>Property</p>
            <p class="js-property-count">0</p>
          </div>

        </div>

        <div class="summary-section">

          <h3>Combined Listing Value</h3>

          <p class="combined-value js-combined-value">
            ₦0
          </p>

        </div>

        <div class="summary-section">

          <h3>Recently Added</h3>

          <p class="js-last-added">
            No saved items yet
          </p>

        </div>

        <button class="browse-products-btn">
          Browse Products
        </button>

      </aside>

    </div>
  </main>

  <script type="module" src="script/watchlist.js"></script>
 

</body>
</html>
